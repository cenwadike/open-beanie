<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beanie — Stealth Payment Claim</title>
  <link rel="stylesheet" href="/styles/stealth.css" />
</head>
<body>
  <main class="stealth-container">
    <h1>Claim Stealth Payments</h1>
    <p class="warning">
      Your spending key is used only in this browser tab to compute
      transaction signatures. It is never sent to Beanie or any server —
      everything below runs client-side. Refreshing this page clears it
      from memory.
    </p>

    <section class="step">
      <h2>1. Scan for payments</h2>
      <label>
        Merchant address
        <input type="text" id="merchant-address" placeholder="0x..." />
      </label>
      <label>
        Viewing key (used only to detect payments — cannot spend)
        <input type="text" id="viewing-key" placeholder="0x..." />
      </label>
      <button id="scan-btn">Scan</button>
      <div id="scan-status"></div>
      <ul id="matches-list"></ul>
    </section>

    <section class="step">
      <h2>2. Claim / sweep to your wallet</h2>
      <label>
        Spending key (stays in this browser tab only)
        <input type="password" id="spend-key" placeholder="0x..." />
      </label>
      <label>
        Destination address to sweep claimed funds to
        <input type="text" id="destination-address" placeholder="0x..." />
      </label>
      <button id="claim-btn" disabled>Claim selected payment</button>
      <div id="claim-status"></div>
    </section>
  </main>

  <script type="module" src="/scripts/stealth-claim.js"></script>
</body>
</html>
