<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
  <title>Beanie — Stealth Payments</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles/stealth.css" />
</head>

<body>
  <div class="page">
    <div class="doodle-field" aria-hidden="true">
      <img class="background-art" src="/assets/beanie-bg.jpg" alt="" />
    </div>
    <div class="veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="Beanie home">
        <span class="wordmark">bean<span class="colon">:</span>ie</span>
      </a>
    </header>

    <main class="stealth-shell">
      <div class="stealth-panel">
        <h1>Claim Private Payments</h1>
        <section class="step">
          <h2>1. Scan for payments</h2>
          <label>
            Lane ID
            <input type="text" id="lane-id" placeholder="your lane ID" autocomplete="off" />
          </label>
          <button id="scan-btn" type="button">Scan with passkey</button>
          <div id="scan-status" class="status"></div>
          <ul id="matches-list"></ul>
        </section>

        <section class="step">
          <h2>2. Claim / sweep to your wallet</h2>
          <label>
            Destination address to sweep claimed funds to
            <input type="text" id="destination-address" placeholder="0x..." autocomplete="off" />
          </label>
          <button id="claim-btn" type="button" disabled>Claim selected payment</button>
          <div id="claim-status" class="status"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/scripts/stealth.claim.js"></script>
  <script type="module" src="/scripts/stealth.setup.js"></script>
</body>

</html>
