<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
  <title>Beanie</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles/beanie.css">
</head>

<body>
  <div class="page">
    <div class="doodle-field" aria-hidden="true">
      <img class="background-art" src="/assets/beanie-bg.jpg" alt="" />
    </div>
    <div class="veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <a class="brand" href="#" aria-label="Beanie home">
      <span class="wordmark">bean<span class="colon">:</span>ie</span>
    </a>

    <div class="right-rail" aria-label="Quick actions">
      <button class="rail-pill" type="button" id="shareBtn">Share Route <span class="share-symbol"
          aria-hidden="true"><svg viewBox="0 0 24 24">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <path d="M8.7 10.7 15.3 6.3M8.7 13.3l6.6 4.4" />
          </svg></span></button>
    </div>

    <main>
      <section class="stage" aria-label="Create payment lane">
        <section class="surface">
          <form class="composer" id="receiverForm">
            <div class="hero-copy">
              <h1><span>One payment lane</span><span>for every chain</span></h1>
              <p>USDC from <strong>any</strong> chain lands straight to your wallet. <br \><span>No middleman.</span>
              </p>
            </div>
            <div class="utility-stack">
              <button class="history-btn" type="button"><span class="action-icon"
                  aria-hidden="true">↶</span><span>History</span></button>
              <button class="history-btn receivers-btn" id="receiversBtn" type="button"><span class="action-icon"
                  aria-hidden="true">⇄</span><span>Lanes</span></button>
            </div>

            <label class="field-wrap">
              <span class="sr-only">Settlement wallet address</span>
              <span class="destination-shell">
                <input class="destination" id="wallet" autocomplete="off" inputmode="text"
                  placeholder="Enter wallet address" required />
              </span>
            </label>

            <label class="field-wrap">
              <span class="sr-only">Settlement chain</span>
              <span class="settlementChainShell">
                <select id="settlementChain" class="settlementChain" aria-label="Settlement chain">
                  <option value="" selected disabled hidden>-- choose your address network --</option>
                  <option value="starknet">Starknet</option>
                  <option value="base">Base</option>
                  <option value="solana">Solana</option>
                </select>
              </span>
            </label>

            <!-- Optional Webhook URL -->
            <label class="compact-field webhook-field">
              <span class="field-label">Webhook URL (optional)</span>
              <input id="webhookUrl" class="compact-input" type="url" autocomplete="off"
                placeholder="https://example.com/webhook" />
            </label>

            <button class="create-btn" id="createReceiverBtn" type="submit">Create Payment Lane</button>
            <div class="inline-config">
              <div class="route-summary" id="routeSummary">USDC lands on Starknet</div>
            </div>
          </form>
        </section>
      </section>
    </main>
    <div class="history-modal" id="historyModal" role="dialog" aria-modal="true" aria-label="History">
      <div class="history-sheet">
        <div class="modal-head">
          <div class="modal-title">
            <strong>History</strong>
            <span id="historySubtitle">Receiver activity</span>
          </div>
          <div class="history-head-actions">
            <button class="history-chain-select" id="historyChainSelect" type="button"
              aria-label="Select history chain">
              <span class="mini-icon" id="historyChainIcon"></span>
              <span id="historyChainName">Base</span>
            </button>
            <div class="history-chain-menu" id="historyChainMenu" role="menu" aria-label="History chain"></div>
            <button class="modal-close" id="closeHistoryModal" type="button" aria-label="Close">×</button>
          </div>
        </div>
        <div id="balancePanel"></div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
    <div class="history-modal" id="receiversModal" role="dialog" aria-modal="true" aria-label="Lanes">
      <div class="history-sheet receivers-sheet">
        <div class="modal-head">
          <div class="modal-title">
            <strong>Lanes</strong>
            <span id="receiversSubtitle">Across active chains</span>
          </div>
          <div class="history-head-actions">
            <button class="modal-close" id="closeReceiversModal" type="button" aria-label="Close">×</button>
          </div>
        </div>
        <div class="receiver-list" id="receiversList"></div>
      </div>
    </div>
    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

  </div>

  <script src="/scripts/beanie.js" defer></script>
</body>

</html>
