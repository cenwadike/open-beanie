[package]
name = "beani_api"
version = "0.1.0"
edition = "2024"

[dependencies]
beanie_keeper = { path = "../beanie_keeper" }
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.151", features = ["derive"] }
anyhow = "1.0.104"
axum = "0.8.9"
ethers = { version = "2.0.14" }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"

dotenvy = "0.15.7"
starknet = "0.17.0"
url = "2.5.8"
hex = "0.4.3"
starknet-crypto = "0.8.1"
tower-http = { version = "0.7.0", features = ["fs"] }
tower = { version = "0.5.3", features = ["util"] }
mime_guess = "2.0.5"
webauthn-rs = "0.5.5"
base64 = "0.23.1"
sha2 = "0.11.0"
